<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebGIS Peonie</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --ink: #231323;
      --muted: #7a6174;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-strong: rgba(255, 255, 255, 0.96);
      --line: rgba(236, 197, 219, 0.7);
      --peony: #db2777;
      --peony-dark: #9d174d;
      --peony-soft: #fce7f3;
      --leaf: #4d7c0f;
      --leaf-soft: #ecfccb;
      --blue: #2563eb;
      --shadow: 0 22px 70px rgba(86, 24, 59, 0.22);
      --radius: 24px;
      --blur: blur(18px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(244, 114, 182, 0.42), transparent 25rem),
        radial-gradient(circle at 88% 12%, rgba(190, 242, 100, 0.34), transparent 23rem),
        linear-gradient(135deg, #fff7fb 0%, #fff 48%, #f7fee7 100%);
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 14px;
    }

    .map-shell {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 30px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      background: #e5e7eb;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .topbar {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      z-index: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      pointer-events: none;
    }

    .brand-card,
    .quick-actions,
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      box-shadow: 0 18px 50px rgba(86, 24, 59, 0.14);
    }

    .brand-card {
      min-width: 0;
      max-width: min(560px, calc(100vw - 220px));
      border-radius: 999px;
      padding: 10px 14px 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background:
        radial-gradient(circle at 32% 28%, #fff, transparent 25%),
        linear-gradient(135deg, #f9a8d4, #db2777 62%, #9d174d);
      color: #fff;
      font-size: 22px;
      box-shadow: 0 10px 28px rgba(219, 39, 119, 0.28);
    }

    .brand-copy {
      min-width: 0;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--peony-dark);
      font-size: 0.7rem;
      line-height: 1;
      font-weight: 950;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .pulse {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--leaf);
      box-shadow: 0 0 0 5px rgba(77, 124, 15, 0.14);
    }

    h1 {
      font-size: clamp(1rem, 2.7vw, 1.28rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .quick-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px;
      pointer-events: auto;
      flex: 0 0 auto;
    }

    button, .link-button {
      appearance: none;
      border: 0;
      cursor: pointer;
      text-decoration: none;
      font: inherit;
      color: var(--peony-dark);
      background: rgba(252, 231, 243, 0.92);
      border: 1px solid rgba(219, 39, 119, 0.14);
      border-radius: 999px;
      padding: 10px 13px;
      font-size: 0.84rem;
      font-weight: 900;
      line-height: 1;
      transition: transform .14s ease, background .14s ease, box-shadow .14s ease;
      user-select: none;
    }

    button:hover, .link-button:hover {
      background: #fbcfe8;
      box-shadow: 0 10px 24px rgba(219, 39, 119, 0.12);
    }

    button:active, .link-button:active {
      transform: scale(.97);
    }

    .primary-button {
      color: #fff;
      background: linear-gradient(135deg, var(--peony), var(--peony-dark));
      border-color: transparent;
      box-shadow: 0 12px 28px rgba(219, 39, 119, 0.22);
    }

    .floating-stack {
      position: absolute;
      top: 118px;
      right: 18px;
      z-index: 610;
      display: grid;
      gap: 10px;
    }

    .fab {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      padding: 0;
      font-size: 1.08rem;
      box-shadow: 0 14px 38px rgba(86, 24, 59, 0.18);
      background: var(--surface-strong);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
    }

    .panel {
      position: absolute;
      left: 18px;
      bottom: 18px;
      z-index: 620;
      width: min(410px, calc(100vw - 36px));
      max-height: min(78vh, 680px);
      display: flex;
      flex-direction: column;
      border-radius: 28px;
      overflow: hidden;
      transition: transform .22s ease, width .2s ease, max-height .2s ease;
    }

    .panel.is-collapsed {
      width: auto;
      max-height: 58px;
      border-radius: 999px;
    }

    .panel-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      background:
        linear-gradient(135deg, rgba(252, 231, 243, 0.94), rgba(255,255,255,0.72)),
        radial-gradient(circle at 0 0, rgba(219, 39, 119, 0.18), transparent 58%);
      border-bottom: 1px solid rgba(241, 217, 230, 0.7);
    }

    .panel.is-collapsed .panel-header {
      border-bottom: 0;
      padding: 9px 10px 9px 14px;
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .panel-title .mini-icon {
      width: 34px;
      height: 34px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: #fff;
      border: 1px solid rgba(219, 39, 119, 0.12);
      box-shadow: 0 10px 24px rgba(219, 39, 119, 0.10);
    }

    .panel-title h2 {
      font-size: 1rem;
      letter-spacing: -0.025em;
      white-space: nowrap;
    }

    .panel-title p {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 1px;
      white-space: nowrap;
    }

    .panel.is-collapsed .panel-title p,
    .panel.is-collapsed .panel-body {
      display: none;
    }

    .panel-toggle {
      width: 38px;
      height: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 1.05rem;
      background: #fff;
      box-shadow: none;
      flex: 0 0 auto;
    }

    .panel.is-collapsed .panel-toggle {
      transform: rotate(180deg);
    }

    .panel-body {
      flex: 1 1 auto;
      overflow: auto;
      padding: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat {
      border-radius: 20px;
      padding: 13px 14px;
      background:
        radial-gradient(circle at 0 0, rgba(219, 39, 119, 0.14), transparent 58%),
        #fff;
      border: 1px solid rgba(241, 217, 230, 0.86);
    }

    .stat strong {
      display: block;
      color: var(--peony-dark);
      font-size: 1.5rem;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section {
      padding: 12px 0;
      border-top: 1px solid rgba(241, 217, 230, 0.78);
    }

    .section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .tool-label {
      display: block;
      color: var(--ink);
      font-size: 0.78rem;
      font-weight: 950;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .search-input {
      width: 100%;
      border: 1px solid rgba(236, 197, 219, 0.95);
      border-radius: 16px;
      padding: 12px 13px;
      font-size: 0.92rem;
      color: var(--ink);
      background: rgba(255,255,255,0.92);
      outline: none;
    }

    .search-input:focus {
      border-color: rgba(219, 39, 119, 0.55);
      box-shadow: 0 0 0 4px rgba(219, 39, 119, 0.11);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid rgba(241, 217, 230, 0.92);
      border-radius: 16px;
      padding: 10px 11px;
      cursor: pointer;
      user-select: none;
      color: var(--muted);
      font-size: 0.83rem;
      font-weight: 850;
    }

    .filter-item input {
      accent-color: var(--peony);
    }

    .legend,
    .counts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .legend-row,
    .count-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #fff;
      border: 1px solid rgba(241, 217, 230, 0.88);
      border-radius: 999px;
      padding: 8px 10px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 850;
    }

    .legend-row {
      justify-content: flex-start;
    }

    .swatch {
      width: 15px;
      height: 15px;
      border-radius: 999px;
      border: 2px solid rgba(124, 45, 18, 0.22);
      flex: 0 0 auto;
    }

    .count-pill strong {
      color: var(--peony-dark);
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .small-button {
      border-radius: 16px;
      padding: 11px 10px;
      font-size: 0.78rem;
      line-height: 1.1;
      box-shadow: none;
      white-space: nowrap;
      background: rgba(255,255,255,0.92);
    }

    .small-button.accent {
      color: #fff;
      background: linear-gradient(135deg, var(--peony), var(--peony-dark));
      border-color: transparent;
    }

    .point-list {
      display: none;
      margin-top: 10px;
      max-height: 230px;
      overflow: auto;
      border: 1px solid rgba(241, 217, 230, 0.9);
      border-radius: 18px;
      background: #fff;
    }

    .point-list.is-visible { display: block; }

    .point-item {
      width: 100%;
      border: 0;
      border-bottom: 1px solid rgba(241, 217, 230, 0.75);
      border-radius: 0;
      box-shadow: none;
      background: #fff;
      color: var(--ink);
      text-align: left;
      padding: 11px 12px;
      cursor: pointer;
    }

    .point-item:last-child { border-bottom: 0; }
    .point-item:hover { background: #fff7fb; }

    .point-item-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 950;
      font-size: 0.84rem;
      color: var(--peony-dark);
    }

    .point-item-meta {
      margin-top: 4px;
      font-size: 0.74rem;
      color: var(--muted);
      line-height: 1.25;
    }

    .status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .error { color: #b91c1c; font-weight: 900; }


    .leaflet-top.leaflet-right {
      top: 232px;
      right: 18px;
    }

    .leaflet-top.leaflet-right .leaflet-control {
      margin: 0 !important;
    }

    .leaflet-control-layers-toggle {
      width: 48px !important;
      height: 48px !important;
      border-radius: 999px !important;
      background-color: rgba(255,255,255,0.96) !important;
      background-size: 24px 24px !important;
      box-shadow: 0 14px 38px rgba(86, 24, 59, 0.18) !important;
    }

    @media (max-width: 760px) {
      .leaflet-top.leaflet-right {
        top: 196px;
        right: 12px;
      }

      .leaflet-control-layers-toggle {
        width: 44px !important;
        height: 44px !important;
      }
    }

    .leaflet-control-zoom {
      border: 0 !important;
      box-shadow: 0 14px 38px rgba(86, 24, 59, 0.16) !important;
    }

    .leaflet-control-zoom a {
      border: 0 !important;
      background: rgba(255,255,255,0.92) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--peony-dark) !important;
      font-weight: 900;
    }

    .leaflet-control-layers {
      border: 1px solid var(--line) !important;
      border-radius: 18px !important;
      box-shadow: 0 14px 38px rgba(86, 24, 59, 0.16) !important;
      background: rgba(255,255,255,0.92) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow: hidden;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 22px !important;
      box-shadow: 0 18px 56px rgba(86, 24, 59, 0.22) !important;
      border: 1px solid rgba(241, 217, 230, 0.86);
    }

    .leaflet-popup-content {
      margin: 14px 16px;
      min-width: 230px;
    }

    .popup-title {
      font-weight: 950;
      color: var(--peony-dark);
      margin-bottom: 8px;
      font-size: 1.02rem;
      letter-spacing: -0.02em;
    }

    .popup-row {
      margin: 5px 0;
      color: #4a3948;
      font-size: 0.9rem;
    }

    .popup-row strong { color: var(--ink); }

    .popup-photos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
      margin-top: 10px;
    }

    .popup-photos a {
      display: block;
      text-decoration: none;
      color: var(--peony-dark);
      background: var(--peony-soft);
      border: 1px solid rgba(219, 39, 119, 0.12);
      border-radius: 12px;
      padding: 8px 8px;
      font-size: 0.78rem;
      font-weight: 900;
      text-align: center;
    }

    .photo-modal {
      position: fixed;
      inset: 0;
      z-index: 4000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background:
        radial-gradient(circle at 18% 10%, rgba(244, 114, 182, 0.26), transparent 34rem),
        rgba(35, 19, 35, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .photo-modal.is-visible { display: flex; }

    .photo-modal-content {
      position: relative;
      width: min(1020px, 96vw);
      max-height: 92vh;
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(241, 217, 230, 0.9);
    }

    .photo-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 15px;
      background: linear-gradient(135deg, #fdf2f8, #fff);
      border-bottom: 1px solid #f1d9e6;
    }

    .photo-modal-title {
      color: var(--peony-dark);
      font-weight: 950;
      font-size: 0.95rem;
    }

    .photo-modal-close {
      width: 38px;
      height: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      background: #fce7f3;
      color: #9d174d;
      font-size: 22px;
      font-weight: 950;
      box-shadow: none;
    }

    .photo-modal img {
      display: block;
      width: 100%;
      max-height: calc(92vh - 65px);
      object-fit: contain;
      background: #111827;
    }

    .locate-dot {
      width: 19px;
      height: 19px;
      border-radius: 999px;
      background: var(--blue);
      border: 3px solid #fff;
      box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.22), 0 10px 25px rgba(37, 99, 235, 0.35);
    }

    @media (max-width: 760px) {
      .app { padding: 8px; }
      .map-shell { border-radius: 22px; }

      .topbar {
        top: 12px;
        left: 12px;
        right: 12px;
        align-items: flex-start;
      }

      .brand-card {
        max-width: calc(100vw - 110px);
        padding: 8px 10px 8px 8px;
      }

      .brand-icon {
        width: 36px;
        height: 36px;
        font-size: 20px;
      }

      .eyebrow { font-size: 0.62rem; }
      h1 { font-size: 0.98rem; }

      .quick-actions {
        padding: 6px;
        gap: 6px;
      }

      .quick-actions .link-button,
      .quick-actions button {
        padding: 9px 10px;
        font-size: 0.78rem;
      }

      .floating-stack {
        top: 96px;
        right: 12px;
        gap: 8px;
      }

      .fab {
        width: 44px;
        height: 44px;
      }

      .panel {
        left: 10px;
        bottom: 10px;
        width: calc(100% - 20px);
        max-height: 60vh;
        border-radius: 24px;
      }

      .panel.is-collapsed {
        width: auto;
        max-width: calc(100% - 20px);
      }

      .legend,
      .counts,
      .filter-grid,
      .button-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="map-shell" aria-label="WebGIS segnalazioni peonie">
      <div id="map"></div>

      <div class="topbar">
        <div class="brand-card">
          <div class="brand-icon" aria-hidden="true">🌸</div>
          <div class="brand-copy">
            <div class="eyebrow"><span class="pulse"></span> WebGIS Peonie</div>
          </div>
        </div>

        <div class="quick-actions">
          <a class="link-button" href="index.html">Home</a>
          <button type="button" id="btnReload" class="primary-button">Aggiorna</button>
        </div>
      </div>

      <div class="floating-stack" aria-label="Comandi rapidi">
        <button type="button" class="fab" id="btnFitPointsFab" title="Zoom ai punti" aria-label="Zoom ai punti">◎</button>
        <button type="button" class="fab" id="btnLocateFab" title="La mia posizione" aria-label="La mia posizione">⌖</button>
      </div>

      <aside class="panel is-collapsed" aria-label="Indice e strumenti WebGIS">
        <div class="panel-header">
          <div class="panel-title">
            <div class="mini-icon" aria-hidden="true">🗺️</div>
            <div>
              <h2>Indice segnalazioni</h2>
            </div>
          </div>
          <button type="button" class="panel-toggle" id="btnTogglePanel" aria-label="Espandi pannello" title="Espandi pannello">▾</button>
        </div>

        <div class="panel-body">
          <div class="stats">
            <div class="stat">
              <strong id="totalPoints">0</strong>
              <span>punti visibili</span>
            </div>
            <div class="stat">
              <strong id="lastUpdate">—</strong>
              <span>ultimo aggiornamento</span>
            </div>
          </div>

          <div class="section">
            <label class="tool-label" for="searchCompiler">Cerca rilevatore</label>
            <input id="searchCompiler" class="search-input" type="search" placeholder="Nome o iniziali">
          </div>

          <div class="section">
            <div class="tool-label">Filtra per individui stimati</div>
            <div class="filter-grid">
              <label class="filter-item"><input type="checkbox" class="classFilter" value="1-9" checked> 1-9</label>
              <label class="filter-item"><input type="checkbox" class="classFilter" value="10-19" checked> 10-19</label>
              <label class="filter-item"><input type="checkbox" class="classFilter" value="20-29" checked> 20-29</label>
              <label class="filter-item"><input type="checkbox" class="classFilter" value="più di 30" checked> &gt;30</label>
            </div>
          </div>

          <div class="section">
            <div class="tool-label">Legenda</div>
            <div class="legend">
              <div class="legend-row"><span class="swatch" style="background:#fef3c7"></span> 1-9</div>
              <div class="legend-row"><span class="swatch" style="background:#facc15"></span> 10-19</div>
              <div class="legend-row"><span class="swatch" style="background:#f59e0b"></span> 20-29</div>
              <div class="legend-row"><span class="swatch" style="background:#ea580c"></span> &gt;30</div>
            </div>
          </div>

          <div class="section">
            <div class="tool-label">Conteggi visibili</div>
            <div class="counts" id="classCounts"></div>
          </div>

          <div class="section">
            <div class="button-grid">
              <button type="button" class="small-button accent" id="btnFitPoints">Zoom punti</button>
              <button type="button" class="small-button" id="btnSardinia">Sardegna</button>
              <button type="button" class="small-button" id="btnCSV">Scarica CSV</button>
              <button type="button" class="small-button" id="btnGeoJSON">GeoJSON</button>
              <button type="button" class="small-button" id="btnLocate">La mia posizione</button>
              <button type="button" class="small-button" id="btnToggleList">Lista punti</button>
            </div>

            <div class="point-list" id="pointList" aria-label="Lista punti visibili"></div>
          </div>

          <div class="status" id="status">Caricamento dati…</div>
        </div>
      </aside>
    </section>
  </main>

  <div class="photo-modal" id="photoModal" aria-hidden="true">
    <div class="photo-modal-content" role="dialog" aria-modal="true" aria-label="Anteprima foto">
      <div class="photo-modal-header">
        <div class="photo-modal-title" id="photoModalTitle">Foto segnalazione</div>
        <button class="photo-modal-close" id="photoModalClose" type="button" aria-label="Chiudi foto">×</button>
      </div>
      <img id="photoModalImg" src="" alt="Foto segnalazione">
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://bvdabdniussqmjjxvrdb.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ2ZGFiZG5pdXNzcW1qanh2cmRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIzNjMwMTAsImV4cCI6MjA3NzkzOTAxMH0.pMKdERP0lygqVoYSsEI4eH60BYcXr5QwJNhxf1ZUddM";
    const TABLE = "points";

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const map = L.map("map", {
      zoomControl: false,
      preferCanvas: true
    }).setView([40.15, 9.05], 7);

    const esriTopo = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri &mdash; Sources: Esri, HERE, Garmin, FAO, NOAA, USGS, &copy; OpenStreetMap contributors, and the GIS User Community"
    }).addTo(map);

    const esriImagery = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community"
    });

    const esriNatGeo = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 16,
      attribution: "Tiles &copy; Esri &mdash; National Geographic, Esri, Garmin, HERE, UNEP-WCMC, USGS, NASA, ESA, METI, NRCAN, GEBCO, NOAA"
    });

    L.control.layers({
      "Esri Topografica": esriTopo,
      "Esri Satellite": esriImagery,
      "Esri NatGeo": esriNatGeo
    }, null, { collapsed: true, position: "topright" }).addTo(map);

    const layer = L.featureGroup().addTo(map);
    let allPoints = [];
    let visiblePoints = [];
    const markerById = new Map();
    let userLocationMarker = null;
    let userAccuracyCircle = null;

    const photoModal = document.getElementById("photoModal");
    const photoModalImg = document.getElementById("photoModalImg");
    const photoModalTitle = document.getElementById("photoModalTitle");
    const photoModalClose = document.getElementById("photoModalClose");

    function openPhotoModal(url, title) {
      photoModalImg.src = url;
      photoModalTitle.textContent = title ? `Foto: ${title}` : "Foto segnalazione";
      photoModal.classList.add("is-visible");
      photoModal.setAttribute("aria-hidden", "false");
    }

    function closePhotoModal() {
      photoModal.classList.remove("is-visible");
      photoModal.setAttribute("aria-hidden", "true");
      photoModalImg.src = "";
    }

    photoModalClose.addEventListener("click", closePhotoModal);
    photoModal.addEventListener("click", event => { if (event.target === photoModal) closePhotoModal(); });
    document.addEventListener("keydown", event => { if (event.key === "Escape") closePhotoModal(); });

    document.addEventListener("click", event => {
      const link = event.target.closest(".photo-preview-link");
      if (!link) return;
      event.preventDefault();
      openPhotoModal(link.dataset.photoUrl, link.dataset.photoTitle);
    });

    function setStatus(message, isError = false) {
      const el = document.getElementById("status");
      el.textContent = message || "";
      el.className = "status" + (isError ? " error" : "");
    }

    function getColor(value) {
      const v = String(value || "").trim().toLowerCase();
      if (v === "1-9") return "#fef3c7";
      if (v === "10-19") return "#facc15";
      if (v === "20-29") return "#f59e0b";
      if (v === "più di 30" || v === "piu di 30" || v === ">30" || v === "30+") return "#ea580c";
      return "#64748b";
    }

    function normalizeClass(value) {
      const v = String(value || "").trim().toLowerCase();
      if (v === "1-9") return "1-9";
      if (v === "10-19") return "10-19";
      if (v === "20-29") return "20-29";
      if (v === "più di 30" || v === "piu di 30" || v === ">30" || v === "30+") return "più di 30";
      return "nd";
    }

    function getSelectedClasses() {
      return Array.from(document.querySelectorAll(".classFilter:checked")).map(el => el.value);
    }

    function getCompilerText(p) {
      return String(p.compiler || p.name || "").trim();
    }

    function pointMatchesFilters(p) {
      const selected = getSelectedClasses();
      const klass = normalizeClass(p.individuals_estimated || p.land_cover);
      if (!selected.includes(klass)) return false;

      const q = String(document.getElementById("searchCompiler").value || "").trim().toLowerCase();
      if (!q) return true;
      return getCompilerText(p).toLowerCase().includes(q);
    }

    function updateClassCounts(points) {
      const labels = [
        ["1-9", "1-9"],
        ["10-19", "10-19"],
        ["20-29", "20-29"],
        ["più di 30", ">30"]
      ];

      const counts = Object.fromEntries(labels.map(([key]) => [key, 0]));
      points.forEach(p => {
        counts[normalizeClass(p.individuals_estimated || p.land_cover)]++;
      });

      const box = document.getElementById("classCounts");
      box.innerHTML = labels.map(([key, label]) =>
        `<div class="count-pill"><span>${label}</span><strong>${counts[key] || 0}</strong></div>`
      ).join("");
    }

    function renderPoints() {
      layer.clearLayers();
      markerById.clear();
      visiblePoints = allPoints.filter(pointMatchesFilters);

      visiblePoints.forEach(p => {
        const category = p.individuals_estimated || p.land_cover || "";
        const color = getColor(category);

        const marker = L.circleMarker([Number(p.lat), Number(p.lon)], {
          radius: 9,
          color: "#7c2d12",
          weight: 1.8,
          fillColor: color,
          fillOpacity: 0.94,
          opacity: 1
        });

        marker.bindPopup(makePopup(p));
        marker.addTo(layer);
        markerById.set(String(p.id), marker);
      });

      renderPointList();

      document.getElementById("totalPoints").textContent = String(visiblePoints.length);
      updateClassCounts(visiblePoints);

      if (visiblePoints.length > 0) {
        setStatus(`Dati caricati correttamente. ${visiblePoints.length}/${allPoints.length} punti visibili.`);
      } else if (allPoints.length > 0) {
        setStatus("Nessun punto corrisponde ai filtri attivi.");
      } else {
        setStatus("Nessun punto disponibile.");
      }

      setTimeout(() => map.invalidateSize(), 150);
    }

    function renderPointList() {
      const box = document.getElementById("pointList");
      if (!box) return;

      if (!visiblePoints.length) {
        box.innerHTML = '<div class="point-item-meta" style="padding:12px;">Nessun punto visibile.</div>';
        return;
      }

      box.innerHTML = visiblePoints.map(p => {
        const id = escapeHtml(p.id);
        const compiler = escapeHtml(p.compiler || p.name || "n.d.");
        const klass = escapeHtml(p.individuals_estimated || p.land_cover || "n.d.");
        const date = escapeHtml(formatDate(p.created_at));
        return `
          <button class="point-item" type="button" data-point-id="${id}">
            <div class="point-item-title">
              <span>${compiler}</span>
              <span>${klass}</span>
            </div>
            <div class="point-item-meta">${date} · ${Number(p.lat).toFixed(5)}, ${Number(p.lon).toFixed(5)}</div>
          </button>
        `;
      }).join("");
    }

    function zoomToPoint(id) {
      const marker = markerById.get(String(id));
      const point = visiblePoints.find(p => String(p.id) === String(id));
      if (!marker || !point) return;

      map.setView([Number(point.lat), Number(point.lon)], Math.max(map.getZoom(), 15));
      marker.openPopup();
    }

    function locateUser() {
      if (!navigator.geolocation) {
        setStatus("Geolocalizzazione non supportata dal browser.", true);
        return;
      }

      setStatus("Cerco la tua posizione…");
      navigator.geolocation.getCurrentPosition(pos => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const acc = pos.coords.accuracy || 0;

        if (userLocationMarker) userLocationMarker.remove();
        if (userAccuracyCircle) userAccuracyCircle.remove();

        const icon = L.divIcon({
          className: "",
          html: '<div class="locate-dot"></div>',
          iconSize: [19, 19],
          iconAnchor: [9.5, 9.5]
        });

        userLocationMarker = L.marker([lat, lon], { icon }).addTo(map).bindPopup("La tua posizione");
        userAccuracyCircle = L.circle([lat, lon], {
          radius: acc,
          color: "#2563eb",
          weight: 1,
          fillColor: "#2563eb",
          fillOpacity: 0.08
        }).addTo(map);

        map.setView([lat, lon], 15);
        userLocationMarker.openPopup();
        setStatus("Posizione utente acquisita.");
      }, err => {
        console.warn(err);
        setStatus("Geolocalizzazione negata o non disponibile.", true);
      }, {
        enableHighAccuracy: true,
        timeout: 15000,
        maximumAge: 0
      });
    }

    function fitVisiblePoints() {
      if (layer.getLayers().length > 0) {
        map.fitBounds(layer.getBounds(), { padding: [42, 42], maxZoom: 15 });
      }
    }

    function downloadText(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function csvEscape(value) {
      const s = String(value ?? "");
      return `"${s.replaceAll('"', '""')}"`;
    }

    function downloadCSV() {
      const fields = [
        "id", "compiler", "individuals_estimated", "lat", "lon", "created_at",
        "photo_site_url", "photo_group_url", "photo_plant_url", "photo_leaf_under_url"
      ];

      const rows = visiblePoints.map(p => fields.map(f => csvEscape(p[f])).join(","));
      const csv = fields.join(",") + "\n" + rows.join("\n");
      downloadText("segnalazioni_peonie.csv", csv, "text/csv;charset=utf-8");
    }

    function downloadGeoJSON() {
      const fc = {
        type: "FeatureCollection",
        features: visiblePoints.map(p => ({
          type: "Feature",
          geometry: {
            type: "Point",
            coordinates: [Number(p.lon), Number(p.lat)]
          },
          properties: {
            id: p.id,
            compiler: p.compiler || p.name || null,
            individuals_estimated: p.individuals_estimated || p.land_cover || null,
            created_at: p.created_at || null,
            photo_site_url: p.photo_site_url || p.photo_url || null,
            photo_group_url: p.photo_group_url || null,
            photo_plant_url: p.photo_plant_url || null,
            photo_leaf_under_url: p.photo_leaf_under_url || null
          }
        }))
      };

      downloadText("segnalazioni_peonie.geojson", JSON.stringify(fc, null, 2), "application/geo+json;charset=utf-8");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
      if (!value) return "n.d.";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "n.d.";
      return d.toLocaleString("it-IT", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function photoLinks(p) {
      const photos = [
        ["Sito", p.photo_site_url || p.photo_url],
        ["Insieme", p.photo_group_url],
        ["Pianta", p.photo_plant_url],
        ["Foglia", p.photo_leaf_under_url]
      ].filter(([, url]) => !!url);

      if (!photos.length) return "";

      return `
        <div class="popup-photos">
          ${photos.map(([label, url]) =>
            `<a href="#" class="photo-preview-link" data-photo-url="${escapeHtml(url)}" data-photo-title="${escapeHtml(label)}">${escapeHtml(label)}</a>`
          ).join("")}
        </div>
      `;
    }

    function makePopup(p) {
      return `
        <div class="popup-title">Segnalazione peonia</div>
        <div class="popup-row"><strong>Rilevatore:</strong> ${escapeHtml(p.compiler || p.name || "n.d.")}</div>
        <div class="popup-row"><strong>Individui stimati:</strong> ${escapeHtml(p.individuals_estimated || p.land_cover || "n.d.")}</div>
        <div class="popup-row"><strong>Data:</strong> ${escapeHtml(formatDate(p.created_at))}</div>
        <div class="popup-row"><strong>Coordinate:</strong> ${Number(p.lat).toFixed(6)}, ${Number(p.lon).toFixed(6)}</div>
        ${photoLinks(p)}
      `;
    }

    async function loadPoints() {
      setStatus("Caricamento dati…");
      layer.clearLayers();

      const { data, error } = await sb
        .from(TABLE)
        .select("id, name, compiler, individuals_estimated, land_cover, lat, lon, created_at, photo_site_url, photo_group_url, photo_plant_url, photo_leaf_under_url, photo_url")
        .not("lat", "is", null)
        .not("lon", "is", null)
        .order("created_at", { ascending: false });

      if (error) {
        console.error(error);
        setStatus("Errore caricamento dati: " + (error.message || "controlla policy Supabase/RLS"), true);
        return;
      }

      allPoints = (data || []).filter(p =>
        Number.isFinite(Number(p.lat)) &&
        Number.isFinite(Number(p.lon)) &&
        Number(p.lat) >= -90 &&
        Number(p.lat) <= 90 &&
        Number(p.lon) >= -180 &&
        Number(p.lon) <= 180
      );

      document.getElementById("lastUpdate").textContent = new Date().toLocaleTimeString("it-IT", {
        hour: "2-digit",
        minute: "2-digit"
      });

      renderPoints();

      if (visiblePoints.length > 0) {
        fitVisiblePoints();
      }
    }

    document.getElementById("searchCompiler").addEventListener("input", renderPoints);
    document.querySelectorAll(".classFilter").forEach(el => {
      el.addEventListener("change", renderPoints);
    });

    document.getElementById("btnFitPoints").addEventListener("click", fitVisiblePoints);
    document.getElementById("btnFitPointsFab").addEventListener("click", fitVisiblePoints);

    document.getElementById("btnSardinia").addEventListener("click", () => {
      map.setView([40.05, 9.05], 7);
    });

    document.getElementById("btnCSV").addEventListener("click", downloadCSV);
    document.getElementById("btnGeoJSON").addEventListener("click", downloadGeoJSON);

    document.getElementById("btnLocate").addEventListener("click", locateUser);
    document.getElementById("btnLocateFab").addEventListener("click", locateUser);

    document.getElementById("btnToggleList").addEventListener("click", () => {
      document.getElementById("pointList").classList.toggle("is-visible");
    });

    document.getElementById("btnTogglePanel").addEventListener("click", () => {
      const panel = document.querySelector(".panel");
      const btn = document.getElementById("btnTogglePanel");
      const collapsed = panel.classList.toggle("is-collapsed");
      btn.setAttribute("aria-label", collapsed ? "Espandi pannello" : "Riduci pannello");
      btn.setAttribute("title", collapsed ? "Espandi pannello" : "Riduci pannello");
      setTimeout(() => map.invalidateSize(), 120);
    });

    document.getElementById("pointList").addEventListener("click", event => {
      const item = event.target.closest(".point-item");
      if (!item) return;
      zoomToPoint(item.dataset.pointId);
    });

    document.getElementById("btnReload").addEventListener("click", () => {
      map.invalidateSize();
      loadPoints();
    });

    window.addEventListener("load", () => {
      setTimeout(() => {
        map.invalidateSize();
        loadPoints();
      }, 250);
    });

    window.addEventListener("resize", () => {
      map.invalidateSize();
    });
  </script>
</body>
</html>
